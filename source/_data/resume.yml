work:
  - name: "Google"
    position: "AI Software Engineer & Tech Lead (Global Office of the CTO)"
    url: "https://blog.google/products/google-cloud/octo-google-clouds-two-way-innovation-street/"
    startDate: "2022-10-01"
    endDate: null
    summary: "Direct technical strategy, software architecture, and high-velocity engineering pods inside the Google Cloud Office of the CTO (OCTO) Innovation Factory, delivering zero-to-one Physical AI simulation systems, deterministic GraphRAG, and applied GenAI platforms."
    highlights:
      - "Engineered an automated Real2Sim procedural 3D physics generator to unblock Reinforcement Learning (RL) policy training for autonomous robotics; synthesized 3D meshes, collision primitives, and friction matrices in Blender 5.2+ from 2D vision extraction with Gemini critic loops, exporting scene graphs into MuJoCo MJCF for GPU-accelerated simulation in MJWarp with 95% spatial ingestion accuracy and a 100% collision-free physics pass rate."
      - "Architected a deterministic GraphRAG engine executing compiled Graph Query Language (GQL) on Google Cloud Spanner Property Graphs with a 3-tier database isolation model (Standard, Extension, Proprietary) and SQL-to-GraphSQL translation for global logistics supply chain platforms, achieving zero-hallucination multi-hop reasoning and transitioning architectures to Core Engineering to upgrade the Data Engineering Agent (DEA)."
      - "Architected and delivered the nationwide Wendy's drive-thru GenAI speech automation engine as Technical Team Lead; invented and patented the Speech Utterance Finalizer (US20250078820A1) to eliminate human deliberation audio fragmentation, boosting order accuracy by 20%, cutting customer wait times by 15%, driving >1B PR impressions, and winning the Google Cloud Customer Empathy Award."
      - "Authored global developer whitepapers and technical guides reaching over 550,000 developers globally, including 300,000+ developers for Spec-Driven Development in 1H 2026 and 400,000+ downloads for the Kaggle Prompt Engineering Guide."
      - "Regained the Brazilian Supreme Court (STF) as a Tier-1 partner by architecting MultiDocAI, a time-aware legal reasoning pipeline that transformed open-ended generation into a constrained JSON-Schema ETL process, achieving 87% initial recall and precision up to 1.0."
      - "Pioneered next-generation multi-agent coordination frameworks and state machine orchestrators utilizing Gemini, Claude, and GPT-4, establishing architectural standards and secure cross-boundary communication protocols using LangGraph and GraphRAG."
      - "Managed a €100k+ annual budget and allocated 25% of leadership effort to product safety as Chapter Lead of the Pride@ Netherlands ERG, directly auditing harmful Dutch dictionary terms for the Google Assistant engineering team."

  - name: "Google"
    position: "Senior Developer Advocate & Applied AI Engineer"
    url: "https://google.com"
    startDate: "2019-01-01"
    endDate: "2022-10-01"
    summary: "Led developer enablement programs and applied engineering proof-of-concept pipelines, establishing cloud AI architecture patterns for Google Cloud's global ecosystem."
    highlights:
      - "Orchestrated the open-source architecture of RCE360, a 622k-line omnichannel platform that resolved persistent state management across Twilio, Business Messages, and Assistant, personally contributing 5.5k unique lines of code and shifting the CCAI product roadmap toward CCaaS."
      - "Accelerated enterprise migration to Google Vertex AI by designing, open-sourcing, and presenting technical architectures as a keynote speaker at over 50 large-scale global conferences (including Google I/O and Cloud Next) to audiences of up to 5,000 developers."

  - name: "Google Netherlands"
    position: "Senior Customer Engineer (Enterprise Platforms)"
    url: "https://google.com"
    startDate: "2017-01-01"
    endDate: "2019-01-01"
    summary: "Served as the primary technical advisor and systems architect for strategic Google Cloud enterprise financial clients in EMEA."
    highlights:
      - "Engineered secure cloud migration roadmaps, distributed computing models, and integration architectures for Tier-1 multinational banking clients including ING and Rabobank."

  - name: "Sencha Inc."
