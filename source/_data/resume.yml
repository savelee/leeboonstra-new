  pronouns: "they/them"
  summary: |
    AI Software Engineer, Tech Lead, and Systems Architect with 10 years of experience within Google's Global Office of the CTO (OCTO) - Innovation Factory. Lee specializes in architecting Physical AI simulation pipelines, deterministic GraphRAG on Spanner Property Graphs, large-scale multi-agent coordination frameworks, and frontier enterprise AI platforms. Renowned as an industry benchmark author (O'Reilly, Apress, Kaggle's Prompt Engineering Guide with 400k+ downloads, and the global Spec-Driven Development whitepaper read by 300k+ engineers) and keynote speaker, Lee empowers engineering squads to sculpt complex AI systems using advanced agentic and physical simulation paradigms.
